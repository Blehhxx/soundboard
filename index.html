<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Centers the widget container perfectly on any screen size */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #191919; /* Dark background to make your purple widget pop */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Wraps your design changes into a locked, centered box */
        .widget-container {
            background: rgba(169, 130, 180, 0.95); /* Your new background color */
            color: #ffffff; /* Switched text to white for clear readability against purple */
            font-family: 'Segoe UI', sans-serif;
            border-radius: 12px;
            padding: 16px;
            width: 240px; /* Locked width so it stays a neat, fixed widget size */
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h3 { 
            margin-top: 0; 
            margin-bottom: 15px;
            font-size: 14px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #643d6e; /* Your new dark purple header color */
        }

        .meme-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn {
            background: rgba(255, 255, 255, 0.12); /* Slightly adjusted for better contrast on purple */
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            margin: 6px 0;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn:hover { 
            background: rgba(255, 255, 255, 0.22); 
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:active { 
            transform: scale(0.96); 
            background: rgba(100, 61, 110, 0.6); /* Active color uses your custom dark purple tint */
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <h3>✨ Sound Board</h3>

        <img src="CatMeme.jpg" alt="Cat Meme" class="meme-img">

        <button class="btn" onclick="playSound('Clap.mp3')">👏 Clapping</button>
        <button class="btn" onclick="playSound('Wow.mp3')">😮 Wowww</button>
        <button class="btn" onclick="playSound('Sad-Trumpet.mp3')">🎺 Sad Trumpet</button>
        <button class="btn" onclick="playSound('Fahhhh.mp3')">🫢 Fahhhh</button>
        <button class="btn" onclick="playSound('Sad-Meow.mp3')">😿 Sad Meow</button>
        <button class="btn" onclick="playSound('Justin-Time.mp3', 14)">🎵 Justin-Time</button>
    </div>

    <script>
        var currentAudio = null;
        var stopTimer = null;

        function playSound(file, startTime) {
            var startFromSeconds = startTime || 0;

            // 1. STOP PREVIOUS SOUND
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if (stopTimer) {
                clearTimeout(stopTimer);
            }

            // 2. PLAY NEW SOUND
            currentAudio = new Audio(file);
            
            // Skip directly to the desired timestamp
            currentAudio.currentTime = startFromSeconds;
            currentAudio.play();

            // 3. ENFORCE 6.0 SECOND TIME LIMIT
            stopTimer = setTimeout(function() {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
            }, 6000); 
        }
    </script>
</body>
</html>
